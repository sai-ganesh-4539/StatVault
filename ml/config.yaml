paths:
  raw_data: "data/raw/"
  features: "data/features/"
  embeddings: "data/embeddings/"
  models: "models/"
  reports: "data/reports/"
  outputs: "outputs/"

models:
  match_prediction:
    file: "xgboost_match.pkl"
    onnx: "xgboost_match.onnx"
    target_col: "match_outcome"  # Win/Draw/Loss
  market_value:
    file: "market_value.pkl"
    onnx: "market_value.onnx"
    target_col: "market_value_eur"
  clustering:
    file: "kmeans_clusters.pkl"
    n_clusters: [4, 5, 6, 7, 8]
  anomaly:
    file: "isolation_forest.pkl"
    onnx: "isolation_forest.onnx"
    contamination: 0.05

embeddings:
  model: "all-MiniLM-L6-v2"
  batch_size: 64
  device: "cpu"  # or "cuda"

db:
  host: "${DB_HOST}"
  port: "${DB_PORT}"
  name: "${DB_NAME}"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"