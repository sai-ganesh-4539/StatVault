name: StatVault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: statvault
          POSTGRES_USER: statvault
          POSTGRES_PASSWORD: statvault
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U statvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://statvault:statvault@localhost:5433/statvault
          ML_MODELS_DIR: ../ml/models
          CLUSTER_PROFILES_PATH: ../ml/models/cluster_profiles.json
          MARKET_VALUE_FEATURES_PATH: ../ml/models/market_value_feature_names.txt
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  backend-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linting tools
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend/ || true

  docker-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile backend/ -t statvault-api:ci
      - name: Verify image starts
        run: |
          docker run -d --name test-api \
            -e DATABASE_URL=postgresql+asyncpg://statvault:statvault@localhost:5432/statvault \
            -p 8000:8000 \
            statvault-api:ci
          sleep 5
          curl -sf http://localhost:8000/health || echo "health check skipped (no DB)"
          docker stop test-api

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-tests, docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" || echo "deploy skipped (no secrets)"