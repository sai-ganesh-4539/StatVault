version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: statvault_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       statvault
      POSTGRES_USER:     statvault_user
      POSTGRES_PASSWORD: statvault_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./etl/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata: