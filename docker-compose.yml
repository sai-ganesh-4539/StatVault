services:
  db:
    image: pgvector/pgvector:pg16
    container_name: statvault_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: statvault
      POSTGRES_USER: statvault
      POSTGRES_PASSWORD: statvault
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./etl/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statvault"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: statvault_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://statvault:statvault@db:5432/statvault
      ML_MODELS_DIR: /ml-models
      CLUSTER_PROFILES_PATH: /ml-models/cluster_profiles.json
      MARKET_VALUE_FEATURES_PATH: /ml-models/market_value_feature_names.txt
    volumes:
      - ./ml/models:/ml-models:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

  frontend:
    build: ./frontend
    container_name: statvault_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      - api